<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCEND AI SUPER PLATFORM</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0a0a0a;
color:white;
}

/* TOP BAR */
.top{
padding:15px;
background:#111;
text-align:center;
font-size:20px;
font-weight:bold;
color:#00f7ff;
letter-spacing:1px;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
width:240px;
background:#151515;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

.sidebar button{
padding:12px;
border:none;
background:#222;
color:white;
border-radius:8px;
cursor:pointer;
transition:0.2s;
font-weight:bold;
}

.sidebar button:hover{
background:#00f7ff;
color:black;
transform:scale(1.03);
}

.sidebar button.active{
background:#00f7ff;
color:black;
}

/* MAIN */
.main{
flex:1;
padding:15px;
overflow:auto;
}

/* CARD */
.card{
background:#1c1c1c;
padding:15px;
margin-bottom:10px;
border-radius:10px;
animation:fadeIn 0.2s ease-in;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(5px);}
to{opacity:1; transform:translateY(0);}
}

/* CHAT */
.chatbox{
background:#111;
padding:10px;
border-radius:10px;
height:350px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.input{
display:flex;
margin-top:10px;
gap:8px;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
outline:none;
background:#222;
color:white;
}

button.send{
padding:10px 15px;
background:#00f7ff;
border:none;
cursor:pointer;
border-radius:8px;
color:black;
font-weight:bold;
}

/* MOBILE */
@media(max-width:768px){
.container{
flex-direction:column;
}
.sidebar{
width:100%;
flex-direction:row;
overflow-x:auto;
}
.sidebar button{
flex:1;
white-space:nowrap;
}
}
</style>
</head>

<body>

<div class="top">🚀 ASCEND AI SUPER PLATFORM</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button class="active" onclick="openTab('feed', this)">🔥 Feed</button>
<button onclick="openTab('chat', this)">🤖 AI Chat</button>
<button onclick="openTab('market', this)">🧠 Marketplace</button>
<button onclick="openTab('dashboard', this)">📊 Dashboard</button>
<button onclick="openTab('voice', this)">🎙 Voice AI</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- FEED -->
<div id="feed" class="tab">
<div class="card">🔥 Viral AI Post #1</div>
<div class="card">🔥 Viral AI Post #2</div>
<div class="card">🔥 AI Generated Feed Engine Ready</div>
</div>

<!-- CHAT -->
<div id="chat" class="tab" style="display:none">
<div class="chatbox" id="chatbox"></div>

<div class="input">
<input id="msg" placeholder="Ask AI..." onkeypress="handleKey(event)" />
<button class="send" onclick="send()">Send</button>
</div>
</div>

<!-- MARKET -->
<div id="market" class="tab" style="display:none">
<div class="card">🧠 Fitness AI Bot</div>
<div class="card">📚 Study AI Bot</div>
<div class="card">💰 Finance AI Bot</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="tab" style="display:none">
<div class="card">📊 Users: 1,234</div>
<div class="card">💰 Revenue: $9,999</div>
<div class="card">🤖 AI Agents: 56</div>
</div>

<!-- VOICE -->
<div id="voice" class="tab" style="display:none">
<div class="card">🎙 Voice AI System Ready</div>
<button class="send" onclick="startVoice()">Start Voice</button>
</div>

</div>
</div>

<script>

let currentTab = "feed";

/* TAB SYSTEM */
function openTab(id, btn){
document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
document.getElementById(id).style.display="block";

document.querySelectorAll(".sidebar button")
.forEach(b=>b.classList.remove("active"));

if(btn) btn.classList.add("active");

currentTab = id;
}

/* SAFE CHAT FUNCTION */
function send(){
let input = document.getElementById("msg");
let box = document.getElementById("chatbox");

let text = input.value.trim();
if(!text) return;

/* SAFE TEXT RENDER */
box.innerHTML += `<div class="card">👤 You: ${escapeHtml(text)}</div>`;

/* AI LOGIC */
let reply = "🤖 I am your AI assistant.";
let t = text.toLowerCase();

if(t.includes("fitness")) reply = "🏋️ Train daily. Consistency beats motivation.";
if(t.includes("money")) reply = "💰 Skills + execution = income.";
if(t.includes("study")) reply = "📚 Study daily, even 1 hour compounds.";
if(t.includes("hello")) reply = "👋 Hello! How can I help you?";

setTimeout(()=>{
box.innerHTML += `<div class="card">🤖 ${reply}</div>`;
box.scrollTop = box.scrollHeight;
},400);

input.value="";
box.scrollTop = box.scrollHeight;
}

/* ENTER KEY SUPPORT */
function handleKey(e){
if(e.key === "Enter") send();
}

/* HTML SAFETY */
function escapeHtml(text){
return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");
}

/* VOICE (UI ONLY) */
function startVoice(){
alert("🎙 Voice AI is UI demo only. Backend required for real AI voice system.");
}

/* DEFAULT TAB */
document.addEventListener("DOMContentLoaded",()=>{
openTab("feed", document.querySelector(".sidebar button"));
});

</script>

</body>
</html>
