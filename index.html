<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCEND AI PLATFORM</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0a0a0a;
color:white;
}

/* TOP */
.top{
padding:15px;
background:#111;
text-align:center;
font-size:20px;
font-weight:bold;
color:#00f7ff;
}

/* LAYOUT */
.container{
display:flex;
height:calc(100vh - 60px);
}

/* SIDEBAR */
.sidebar{
width:220px;
background:#151515;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

.sidebar button{
padding:12px;
border:none;
background:#222;
color:white;
border-radius:8px;
cursor:pointer;
}

.sidebar button:hover{
background:#00f7ff;
color:black;
}

/* MAIN */
.main{
flex:1;
padding:15px;
overflow:auto;
}

/* CARD */
.card{
background:#1c1c1c;
padding:15px;
margin-bottom:10px;
border-radius:10px;
}

/* CHAT */
.chatbox{
background:#111;
padding:10px;
border-radius:10px;
height:300px;
overflow-y:auto;
}

.input{
display:flex;
margin-top:10px;
gap:8px;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
outline:none;
}

button.send{
padding:10px 15px;
background:#00f7ff;
border:none;
cursor:pointer;
border-radius:8px;
color:black;
}
</style>
</head>

<body>

<div class="top">🚀 ASCEND AI SUPER PLATFORM</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button onclick="openTab('feed')">🔥 Feed</button>
<button onclick="openTab('chat')">🤖 AI Chat</button>
<button onclick="openTab('market')">🧠 Marketplace</button>
<button onclick="openTab('dashboard')">📊 Dashboard</button>
<button onclick="openTab('voice')">🎙 Voice AI</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- FEED -->
<div id="feed" class="tab">
<div class="card">🔥 Viral AI Post #1</div>
<div class="card">🔥 Viral AI Post #2</div>
<div class="card">🔥 AI Generated Feed</div>
</div>

<!-- CHAT -->
<div id="chat" class="tab" style="display:none">
<div class="chatbox" id="chatbox"></div>

<div class="input">
<input id="msg" placeholder="Ask AI..." />
<button class="send" onclick="send()">Send</button>
</div>
</div>

<!-- MARKET -->
<div id="market" class="tab" style="display:none">
<div class="card">🧠 Fitness AI Bot</div>
<div class="card">📚 Study AI Bot</div>
<div class="card">💰 Finance AI Bot</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="tab" style="display:none">
<div class="card">📊 Users: 1,234</div>
<div class="card">💰 Revenue: $9,999</div>
<div class="card">🤖 Agents: 56</div>
</div>

<!-- VOICE -->
<div id="voice" class="tab" style="display:none">
<div class="card">🎙 Voice AI System Ready</div>
<button onclick="startVoice()">Start Voice</button>
</div>

</div>
</div>

<script>

function openTab(id){
document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
document.getElementById(id).style.display="block";
}

/* FIXED CHAT */
function send(){
let input=document.getElementById("msg");
let box=document.getElementById("chatbox");

let text=input.value.trim();
if(!text) return;

box.innerHTML += `<div class="card">You: ${text}</div>`;

/* AI RESPONSE */
let reply="🤖 I am your AI assistant.";

if(text.includes("fitness")) reply="🏋️ Train daily with discipline.";
if(text.includes("money")) reply="💰 Focus on skills + execution.";
if(text.includes("study")) reply="📚 Learn consistently every day.";

/* FIXED AUTO SCROLL */
setTimeout(()=>{
box.innerHTML += `<div class="card">${reply}</div>`;
box.scrollTop = box.scrollHeight;
},400);

input.value="";
}

/* VOICE FIX */
function startVoice(){
alert("🎙 Voice AI is UI demo only. Backend needed for real voice.");
}

</script>

</body>
</html>
