<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ascend Mode</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#050505,#0f0f2a);
  color:white;
  overflow-x:hidden;
  text-align:center;
}

/* Loader */
#loader{
  position:fixed;
  width:100%;
  height:100%;
  background:#000;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:999;
  font-size:2em;
}

/* Navbar */
nav{
  position:fixed;
  top:0;
  width:100%;
  padding:15px;
  background:rgba(0,0,0,0.6);
  backdrop-filter:blur(10px);
}

/* Animated background */
body::before{
  content:'';
  position:fixed;
  width:200%;
  height:200%;
  background:radial-gradient(circle,#6a00ff22,#000000);
  animation:move 10s linear infinite;
  z-index:-1;
}

@keyframes move{
  from{transform:translate(0,0)}
  to{transform:translate(-50%,-50%)}
}

header{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

h1{
  font-size:4em;
  background:linear-gradient(90deg,#6a00ff,#00d4ff);
  -webkit-background-clip:text;
  color:transparent;
}

button{
  margin-top:25px;
  padding:15px 35px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#6a00ff,#00d4ff);
  color:white;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:scale(1.1);
  box-shadow:0 0 25px #6a00ff;
}

section{
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}

/* Scroll animation */
.fade{
  opacity:0;
  transform:translateY(40px);
  transition:1s;
}

.show{
  opacity:1;
  transform:translateY(0);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:rgba(255,255,255,0.05);
  padding:25px;
  border-radius:20px;
  backdrop-filter:blur(12px);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-10px);
  box-shadow:0 0 30px #6a00ff;
}

/* Progress */
.progress{
  height:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
  margin-top:15px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6a00ff,#00d4ff);
}

/* Chat */
.chatbox{
  max-width:500px;
  margin:40px auto;
  background:#111;
  padding:20px;
  border-radius:15px;
}

.chatbox input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="loader">Loading...</div>

<nav>
<h3>Ascend Mode</h3>
</nav>

<header>
<h1>Ascend Mode</h1>
<p>No chasing. Just becoming</p>
<button onclick="scrollToMain()">Enter</button>
</header>

<section id="main" class="fade">
<h2>Core Upgrades</h2>
<div class="grid">
<div class="card">🏋️ Body Discipline</div>
<div class="card">🧠 Mind Control</div>
<div class="card">😎 Social Presence</div>
<div class="card">🔥 Consistency</div>
</div>
</section>

<section class="fade">
<h2>Daily Tracker</h2>
<label><input type="checkbox" onclick="updateProgress()"> Workout</label><br>
<label><input type="checkbox" onclick="updateProgress()"> Grooming</label><br>
<label><input type="checkbox" onclick="updateProgress()"> Learning</label><br>
<label><input type="checkbox" onclick="updateProgress()"> Social</label>

<div class="progress"><div class="progress-bar" id="bar"></div></div>
</section>

<section class="fade">
<h2>Mindset Rules</h2>
<div class="grid">
<div class="card">Silence is power</div>
<div class="card">Don't chase attention</div>
<div class="card">Stay unpredictable</div>
<div class="card">Respect yourself first</div>
</div>
</section>

<section class="fade">
<h2>AI Coach</h2>
<div class="chatbox">
<p id="response">Ask something...</p>
<input type="text" id="input" placeholder="Type here..." onkeydown="talk(event)">
</div>
</section>

<script>
function scrollToMain(){
 document.getElementById('main').scrollIntoView({behavior:'smooth'});
}

/* Progress save */
function updateProgress(){
 let checks=document.querySelectorAll('input[type=checkbox]');
 let total=checks.length;
 let done=0;

 checks.forEach((c,i)=>{
   if(c.checked){
     done++;
     localStorage.setItem("check"+i,true);
   }else{
     localStorage.removeItem("check"+i);
   }
 });

 document.getElementById('bar').style.width=(done/total*100)+'%';
}

/* Load saved */
window.onload=()=>{
 let checks=document.querySelectorAll('input[type=checkbox]');
 checks.forEach((c,i)=>{
   if(localStorage.getItem("check"+i)){
     c.checked=true;
   }
 });
 updateProgress();
 document.getElementById("loader").style.display="none";
}

/* Scroll animation */
window.addEventListener('scroll',()=>{
 let elements=document.querySelectorAll('.fade');
 elements.forEach(el=>{
   let position=el.getBoundingClientRect().top;
   if(position < window.innerHeight-100){
     el.classList.add('show');
   }
 });
});

/* AI */
function talk(e){
 if(e.key==='Enter'){
  let input=document.getElementById('input').value.toLowerCase();
  let res="Stay focused.";
  if(input.includes('confidence')) res="Confidence comes from action.";
  if(input.includes('motivation')) res="Discipline beats motivation.";
  if(input.includes('girl')) res="Focus on value, not validation.";
  document.getElementById('response').innerText=res;
  document.getElementById('input').value='';
 }
}
</script>

</body>
</html>
