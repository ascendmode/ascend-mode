<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCEND AI SUPER PLATFORM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:white}

/* TOP */
.top{
padding:15px;
background:#111;
text-align:center;
font-size:20px;
font-weight:bold;
color:#00f7ff;
}

/* LAYOUT */
.container{display:flex;height:calc(100vh - 60px)}

/* SIDEBAR */
.sidebar{
width:240px;
background:#151515;
padding:10px;
display:flex;
flex-direction:column;
gap:10px;
}

.sidebar button{
padding:12px;
border:none;
background:#222;
color:white;
border-radius:8px;
cursor:pointer;
transition:0.2s;
font-weight:bold;
}

.sidebar button:hover{background:#00f7ff;color:black}
.sidebar button.active{background:#00f7ff;color:black}

/* MAIN */
.main{flex:1;padding:15px;overflow:auto}

/* CARD */
.card{
background:#1c1c1c;
padding:15px;
margin-bottom:10px;
border-radius:10px;
animation:fade 0.2s ease-in;
}

@keyframes fade{
from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:translateY(0)}
}

/* CHAT */
.chatbox{
background:#111;
padding:10px;
border-radius:10px;
height:350px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:8px;
}

.input{display:flex;margin-top:10px;gap:8px}

input{
flex:1;
padding:10px;
border:none;
border-radius:8px;
outline:none;
background:#222;
color:white;
}

button.send{
padding:10px 15px;
background:#00f7ff;
border:none;
cursor:pointer;
border-radius:8px;
color:black;
font-weight:bold;
}

/* EMPTY STATE */
.empty{
color:#777;
text-align:center;
margin-top:20px;
}

/* MOBILE */
@media(max-width:768px){
.container{flex-direction:column}
.sidebar{
width:100%;
flex-direction:row;
overflow-x:auto;
}
.sidebar button{flex:1}
}
</style>
</head>

<body>

<div class="top">🚀 ASCEND AI SUPER PLATFORM</div>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
<button class="active" onclick="openTab('feed', this)">🔥 Feed</button>
<button onclick="openTab('chat', this)">🤖 AI Chat</button>
<button onclick="openTab('market', this)">🧠 Marketplace</button>
<button onclick="openTab('dashboard', this)">📊 Dashboard</button>
<button onclick="openTab('voice', this)">🎙 Voice AI</button>
</div>

<!-- MAIN -->
<div class="main">

<!-- FEED -->
<div id="feed" class="tab">
<div class="card">🔥 Viral AI Post #1</div>
<div class="card">🔥 Viral AI Post #2</div>
<div class="card">🔥 AI Feed Engine Active</div>
</div>

<!-- CHAT -->
<div id="chat" class="tab" style="display:none">

<div class="chatbox" id="chatbox"></div>

<div class="input">
<input id="msg" placeholder="Ask AI..." onkeypress="handleKey(event)" />
<button class="send" onclick="send()">Send</button>
</div>

</div>

<!-- MARKET -->
<div id="market" class="tab" style="display:none">
<div class="card">🧠 Fitness AI Bot</div>
<div class="card">📚 Study AI Bot</div>
<div class="card">💰 Finance AI Bot</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="tab" style="display:none">
<div class="card">📊 Users: 1,234</div>
<div class="card">💰 Revenue: $9,999</div>
<div class="card">🤖 Agents: 56</div>
</div>

<!-- VOICE -->
<div id="voice" class="tab" style="display:none">
<div class="card">🎙 Voice AI Ready</div>
<button class="send" onclick="startVoice()">Start Voice</button>
</div>

</div>
</div>

<script>

let chatBox = document.getElementById("chatbox");

/* TAB SYSTEM */
function openTab(id, btn){
document.querySelectorAll(".tab").forEach(t=>t.style.display="none");
document.getElementById(id).style.display="block";

document.querySelectorAll(".sidebar button")
.forEach(b=>b.classList.remove("active"));

btn.classList.add("active");
}

/* CREATE MESSAGE */
function addMessage(text, type){
let div = document.createElement("div");
div.className = "card";
div.innerText = (type==="user" ? "👤 You: " : "🤖 ") + text;
chatBox.appendChild(div);

/* ALWAYS SMOOTH SCROLL */
chatBox.scrollTo({
top: chatBox.scrollHeight,
behavior:"smooth"
});

/* SAVE MEMORY */
saveChat();
}

/* AI TYPING EFFECT */
function typeMessage(text){
let div = document.createElement("div");
div.className = "card";
chatBox.appendChild(div);

let i = 0;
let interval = setInterval(()=>{
div.innerText = "🤖 " + text.slice(0,i);
i++;
chatBox.scrollTo({top:chatBox.scrollHeight});

if(i > text.length) clearInterval(interval);
},20);
}

/* CHAT SEND */
function send(){
let input = document.getElementById("msg");
let text = input.value.trim();
if(!text) return;

addMessage(text,"user");

let reply = "I am your AI assistant.";
let t = text.toLowerCase();

if(t.includes("fitness")) reply="Train daily. Discipline wins.";
if(t.includes("money")) reply="Skills + execution = income.";
if(t.includes("study")) reply="Study daily. Consistency is key.";
if(t.includes("hello")) reply="Hello! How can I help you?";

setTimeout(()=>{
typeMessage(reply);
},400);

input.value="";
}

/* ENTER KEY */
function handleKey(e){
if(e.key==="Enter") send();
}

/* VOICE */
function startVoice(){
alert("Voice AI needs backend integration.");
}

/* SAVE CHAT */
function saveChat(){
localStorage.setItem("chat", chatBox.innerHTML);
}

/* LOAD CHAT */
window.onload = ()=>{
let saved = localStorage.getItem("chat");
if(saved) chatBox.innerHTML = saved;
};

</script>

</body>
</html>
